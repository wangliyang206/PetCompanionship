<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>长风幼崽 · 骨骼模型试点预览</title>
<style>
  html,body{margin:0;height:100%;background:#f2f3f5;font-family:"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden}
  #app{position:relative;width:100%;height:100%}
  canvas{display:block}
  .panel{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);
    display:flex;gap:10px;background:rgba(255,255,255,.92);padding:10px 14px;border-radius:14px;
    box-shadow:0 4px 16px rgba(0,0,0,.12)}
  .panel button{border:0;border-radius:10px;padding:9px 18px;font-size:14px;cursor:pointer;
    background:#e7e9ee;color:#333;transition:.15s}
  .panel button.active{background:#3b82f6;color:#fff}
  .panel button:hover:not(.active){background:#d8dbe2}
  .tag{position:absolute;top:16px;left:50%;transform:translateX(-50%);text-align:center;
    background:rgba(255,255,255,.9);padding:8px 18px;border-radius:12px;font-size:13px;color:#555;
    box-shadow:0 2px 10px rgba(0,0,0,.08)}
  .tag b{color:#1f2937}
  #loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:15px;color:#666;background:#f2f3f5;z-index:9}
</style>
</head>
<body>
<div id="app">
  <div id="loading">模型加载中…</div>
  <div class="tag"><b>长风幼崽</b>（试点第 1 只）· 23 骨骼 · 自动权重 · 3 段动画 · 拖拽旋转 / 滚轮缩放</div>
  <div class="panel">
    <button data-act="idle" class="active">待机 idle</button>
    <button data-act="walk">走路 walk</button>
    <button data-act="happy">开心 happy</button>
  </div>
</div>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const app = document.getElementById('app');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf2f3f5);
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, .05, 20);
camera.position.set(0, .45, 1.05);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
app.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, .18, 0);
controls.enableDamping = true;

scene.add(new THREE.HemisphereLight(0xffffff, 0xdddddd, 2.2));
const dir = new THREE.DirectionalLight(0xffffff, 1.6);
dir.position.set(1.2, 2, 1.5);
scene.add(dir);

let mixer = null, actions = {};
const clock = new THREE.Clock();

new GLTFLoader().load('./changfeng_baby_rigged.glb', (gltf) => {
  document.getElementById('loading').remove();
  const model = gltf.scene;
  // 统一摆到画面中心（模型原点在脚底）
  const box = new THREE.Box3().setFromObject(model);
  const c = box.getCenter(new THREE.Vector3());
  model.position.x -= c.x; model.position.z -= c.z;
  scene.add(model);
  mixer = new THREE.AnimationMixer(model);
  gltf.animations.forEach(clip => actions[clip.name] = mixer.clipAction(clip));
  play('idle');
}, undefined, () => {
  document.getElementById('loading').textContent = '加载失败：请通过本地 HTTP 服务打开本页';
});

function play(name){
  Object.entries(actions).forEach(([k, a]) => {
    if (k === name){ a.reset().fadeIn(.2).play(); } else { a.fadeOut(.2); }
  });
}

document.querySelectorAll('.panel button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.panel button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    play(btn.dataset.act);
  });
});

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  mixer && mixer.update(clock.getDelta());
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
